name: catfish_peace
description: "Sistem Monitoring & Kontrol Kualitas Air Kolam Lele - Catfish Peace."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Utilities
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  shimmer: ^3.0.0

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Firebase Core & Services
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_database: ^11.3.10
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Konfigurasi aset proyek (logo, ikon, dan referensi UI)
  assets:
    - assets/
    - assets/icons/
    - assets/ui/
